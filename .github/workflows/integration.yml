# Project-owned workaround: the template's ci.yml has no opt-in integration job
# (metalayerlab/project-template#81). Delete this file when that job lands.
name: Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration:
    name: Integration (real FUSE mount)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true

      # build: compiles pyfuse3; runtime: fuse3 gives the setuid fusermount3
      - name: System packages
        run: |
          sudo apt-get update
          sed -n 's/^\(build\|runtime\)://p' contrib/system-packages.txt | xargs sudo apt-get install -y --no-install-recommends

      - name: Install (from the lock file, with the fuse extra)
        run: uv sync --locked --extra fuse

      # The integration tests skip without these; a skip here would pass vacuously
      - name: FUSE preconditions
        run: |
          test -c /dev/fuse
          command -v fusermount3
          uv run python -c "import pyfuse3"

      # The whole suite, so the coverage floor also counts fs.py and mount.py
      - name: Tests, integration included
        run: RUN_INTEGRATION=1 uv run pytest
