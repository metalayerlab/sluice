# Template-owned: template-base. PRs are squash-merged, so the PR title becomes the
# commit on main: a Conventional Commit, which a stack that releases reads for its version.
#
#   feat: add X  /  fix: stop Y  /  feat!: (or BREAKING CHANGE: in the body)
#   docs: / refactor: / perf: / test: / build: / ci: / chore: / revert:
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          # The subject is the changelog line: start lower-case, no trailing full stop.
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: |
            "{subject}" should start lower-case and not end with a full stop:
            it becomes the commit message on main.
