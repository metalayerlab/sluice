[project]
name = "sluice"
# Owned by release-please: never edit by hand (see the wiki's Release-Process page).
version = "0.0.0"
description = "Sluice — a Python FUSE filesystem with an Express-style router that gates, rewrites, and middleware-intercepts every filesystem call between virtual paths and their backing stores."
readme = "README.md"
requires-python = ">=3.13"
license = "Unlicense"
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.scripts]
sluice = "sluice.cli:main"

[project.urls]
Homepage = "https://github.com/metalayerlab/sluice"
Documentation = "https://github.com/metalayerlab/sluice/wiki"
Changelog = "https://github.com/metalayerlab/sluice/blob/main/CHANGELOG.md"

[project.optional-dependencies]
fuse = [
    "pyfuse3>=3.5.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sluice"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks; scripts print, and run git, by design.
"tests/*" = ["S101"]
"scripts/*" = ["T20", "S603", "S607"]

[tool.mypy]
strict = true
files = ["src/sluice", "tests", "scripts"]

[[tool.mypy.overrides]]
# pyfuse3 is the optional `fuse` extra (design 0001, question 10): CI installs without it, and
# only fs.py and mount.py import it. Where it is installed, its own types are checked.
module = ["pyfuse3", "pyfuse3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config --cov --cov-report=term-missing:skip-covered"
testpaths = ["tests"]
markers = ["integration: talks to real external systems; deselect with -m 'not integration'"]
# A deprecation fails the dependency bump that brings it, not a later run.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["sluice"]
omit = ["*/__main__.py"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]
