# sluice configuration: every setting, with its default.
#
# Copy to /etc/sluice/config.yaml (or point SLUICE_CONFIG / --config
# at it). Every key can also be set as an environment variable,
# SLUICE_<KEY> (dots become underscores), or read from a file with
# SLUICE_<KEY>_FILE. Secrets belong in _FILE, never in this file.
# Full reference: the wiki's In-Depth-Configuration page.

# DEBUG, INFO, WARNING or ERROR
log_level: INFO

app:
  # The app to serve, module:attribute (e.g. myroutes:app). Required.
  module: ""
  # Directory put first on sys.path before importing app.module. Empty: unchanged.
  dir: ""

mount:
  # Where to mount: an existing, empty directory. Required by `sluice mount`.
  point: ""
  # Filesystem name shown by mount and df
  fsname: sluice
  # Let other users in (needs user_allow_other in /etc/fuse.conf)
  allow_other: false
  # Kernel entry/attribute cache in ms; above 0, cached calls skip middleware
  cache_ms: 0
  # libfuse request tracing; logs raw paths, tokens included: lab use only
  debug: false

io:
  # Worker threads for backend syscalls
  threads: 8

env:
  # Environment variable names copied into ctx.config.env: a list, or comma-separated
  expose: []

secrets:
  # Each regular file becomes ctx.config.secret[<filename>]
  dir: /run/secrets

pipeline:
  # Warn when a middleware or handler holds the event loop longer than this (ms); 0 = off
  slow_ms: 0
  # Cancel a middleware hook that runs longer than this (ms) and fail the call with EIO; 0 = off
  timeout_ms: 0

backend:
  # Backend calls left running in I/O threads after a timeout, before new backend calls
  # fail with EIO instead of queueing; at most io.threads; 0 = half of io.threads
  max_abandoned: 0

metrics:
  # Serve Prometheus metrics as the read-only file /.sluice/metrics; reserves /.sluice
  enabled: false
